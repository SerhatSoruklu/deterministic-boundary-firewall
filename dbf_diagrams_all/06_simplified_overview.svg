<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="100%" height="100%" fill="#0b1020"/>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L14,7 L0,14 z" fill="#8fb7ff"/>
      </marker>
      <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L14,7 L0,14 z" fill="#ff9aa2"/>
      </marker>
      <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="#131a2d"/>
        <stop offset="100%" stop-color="#0f1527"/>
      </linearGradient>
      <linearGradient id="accentBlue" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#7aa2ff"/>
        <stop offset="100%" stop-color="#52d3ff"/>
      </linearGradient>
      <linearGradient id="accentRed" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#ff8f8f"/>
        <stop offset="100%" stop-color="#ffb86c"/>
      </linearGradient>
      <style>
        .title { font: 700 38px Arial, sans-serif; fill: #f4f7ff; }
        .subtitle { font: 500 18px Arial, sans-serif; fill: #b9c6e3; }
        .h2 { font: 700 22px Arial, sans-serif; fill: #eef3ff; }
        .text { font: 500 16px Arial, sans-serif; fill: #d8e0f5; }
        .tiny { font: 500 14px Arial, sans-serif; fill: #aebad8; }
        .mono { font: 600 15px 'Courier New', monospace; fill: #dce6ff; }
        .cap { font: 700 13px Arial, sans-serif; fill: #7aa2ff; letter-spacing: 1px; }
      </style>
    </defs>
    <text x="60" y="80" class="title">Deterministic Boundary Firewall • Simplified Overview</text><text x="60" y="112" class="subtitle">Audience version for README / wiki / overview docs.</text>
    <g filter="url(#shadow)">
      <rect x="70" y="220" rx="24" ry="24" width="330" height="220" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="90" y="238" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="94" y="278" class="h2">User input</text>
    <text x="94" y="306" class="cap">start</text><text x="94" y="338" class="text">Prompt or tool payload enters</text><text x="94" y="362" class="text">the system</text></g>
    <g filter="url(#shadow)">
      <rect x="490" y="180" rx="24" ry="24" width="360" height="300" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="510" y="198" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="514" y="238" class="h2">BoundaryGate</text>
    <text x="514" y="266" class="cap">shared firewall</text><text x="514" y="298" class="text">Normalize</text><text x="514" y="322" class="text">Inspect</text><text x="514" y="346" class="text">Match bounded rules</text><text x="514" y="370" class="text">Return clean or refuse</text></g>
    <g filter="url(#shadow)">
      <rect x="960" y="160" rx="24" ry="24" width="260" height="160" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="980" y="178" rx="8" ry="8" width="220" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="984" y="218" class="h2">Clean</text>
    <text x="984" y="246" class="cap">allow path</text><text x="984" y="278" class="text">Request proceeds</text></g>
    <g filter="url(#shadow)">
      <rect x="960" y="380" rx="24" ry="24" width="260" height="160" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="980" y="398" rx="8" ry="8" width="220" height="8" fill="url(#accentRed)" opacity="0.95"/>
      <text x="984" y="438" class="h2">Blocked</text>
    <text x="984" y="466" class="cap">deny path</text><text x="984" y="498" class="text">Standard refusal</text></g>
    <g filter="url(#shadow)">
      <rect x="1300" y="120" rx="24" ry="24" width="220" height="240" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="1320" y="138" rx="8" ry="8" width="180" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="1324" y="178" class="h2">Client path</text>
    <text x="1324" y="206" class="cap">app.py</text><text x="1324" y="238" class="text">OpenAI request</text></g>
    <g filter="url(#shadow)">
      <rect x="1300" y="400" rx="24" ry="24" width="220" height="240" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="1320" y="418" rx="8" ry="8" width="180" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="1324" y="458" class="h2">Server path</text>
    <text x="1324" y="486" class="cap">server.py</text><text x="1324" y="518" class="text">MCP tool result</text></g><line x1="400" y1="330" x2="490" y2="330" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><line x1="850" y1="260" x2="960" y2="240" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="785.0" y="216.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="905.0" y="238.0" class="tiny" text-anchor="middle">safe</text><line x1="850" y1="400" x2="960" y2="460" stroke="#ff9aa2" stroke-width="5" marker-end="url(#arrowRed)"/><rect x="785.0" y="396.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="905.0" y="418.0" class="tiny" text-anchor="middle">tripwire</text><line x1="1220" y1="240" x2="1300" y2="240" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><line x1="1220" y1="460" x2="1300" y2="520" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><text x="800" y="760" class="subtitle" text-anchor="middle">One enforcement kernel. Two surfaces. No egress or tool completion before validation.</text></svg>