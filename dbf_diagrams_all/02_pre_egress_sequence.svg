<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
    <rect width="100%" height="100%" fill="#0b1020"/>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L14,7 L0,14 z" fill="#8fb7ff"/>
      </marker>
      <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L14,7 L0,14 z" fill="#ff9aa2"/>
      </marker>
      <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="#131a2d"/>
        <stop offset="100%" stop-color="#0f1527"/>
      </linearGradient>
      <linearGradient id="accentBlue" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#7aa2ff"/>
        <stop offset="100%" stop-color="#52d3ff"/>
      </linearGradient>
      <linearGradient id="accentRed" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#ff8f8f"/>
        <stop offset="100%" stop-color="#ffb86c"/>
      </linearGradient>
      <style>
        .title { font: 700 38px Arial, sans-serif; fill: #f4f7ff; }
        .subtitle { font: 500 18px Arial, sans-serif; fill: #b9c6e3; }
        .h2 { font: 700 22px Arial, sans-serif; fill: #eef3ff; }
        .text { font: 500 16px Arial, sans-serif; fill: #d8e0f5; }
        .tiny { font: 500 14px Arial, sans-serif; fill: #aebad8; }
        .mono { font: 600 15px 'Courier New', monospace; fill: #dce6ff; }
        .cap { font: 700 13px Arial, sans-serif; fill: #7aa2ff; letter-spacing: 1px; }
      </style>
    </defs>
    <text x="70" y="80" class="title">Pre-Egress Interception Invariant • Sequence Diagram</text><text x="70" y="112" class="subtitle">Illustrates the exact branch: normalize → inspect → firewall → clean egress OR ERR-403-SINK refusal.</text><text x="120" y="180" class="h2" text-anchor="middle">User / caller</text><line x1="120" y1="210" x2="120" y2="1080" stroke="#2b3c63" stroke-width="3" stroke-dasharray="10 10"/><text x="430" y="180" class="h2" text-anchor="middle">IG-04-A app.py</text><line x1="430" y1="210" x2="430" y2="1080" stroke="#2b3c63" stroke-width="3" stroke-dasharray="10 10"/><text x="860" y="180" class="h2" text-anchor="middle">BoundaryGate / FW-TRIPWIRE-04</text><line x1="860" y1="210" x2="860" y2="1080" stroke="#2b3c63" stroke-width="3" stroke-dasharray="10 10"/><text x="1320" y="180" class="h2" text-anchor="middle">OpenAI / external tool</text><line x1="1320" y1="210" x2="1320" y2="1080" stroke="#2b3c63" stroke-width="3" stroke-dasharray="10 10"/><text x="1710" y="180" class="h2" text-anchor="middle">ERR-403-SINK</text><line x1="1710" y1="210" x2="1710" y2="1080" stroke="#2b3c63" stroke-width="3" stroke-dasharray="10 10"/><line x1="120" y1="260" x2="430" y2="260" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="155.0" y="226.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="275.0" y="248.0" class="tiny" text-anchor="middle">1. prompt arrives</text><line x1="430" y1="340" x2="860" y2="340" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="525.0" y="306.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="645.0" y="328.0" class="tiny" text-anchor="middle">2. build_inspection_surface(data, params)</text><line x1="860" y1="430" x2="860" y2="430" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="740.0" y="396.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="860.0" y="418.0" class="tiny" text-anchor="middle">3. normalize: percent-decode, NFKC/NFKD, remove Cf/Cc, fold confusables, punctuation fold, collapse/stitch split terms</text><line x1="860" y1="525" x2="860" y2="525" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="740.0" y="491.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="860.0" y="513.0" class="tiny" text-anchor="middle">4. _scan(): patterns + path_terms + density thresholds + infra-adjacent clustering</text><line x1="860" y1="620" x2="430" y2="620" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="525.0" y="586.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="645.0" y="608.0" class="tiny" text-anchor="middle">5a. clean → return control</text><line x1="430" y1="710" x2="1320" y2="710" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="755.0" y="676.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="875.0" y="698.0" class="tiny" text-anchor="middle">6a. request.Request / urlopen</text><line x1="1320" y1="800" x2="430" y2="800" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="755.0" y="766.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="875.0" y="788.0" class="tiny" text-anchor="middle">7a. response returns</text><line x1="860" y1="920" x2="1710" y2="920" stroke="#ff9aa2" stroke-width="5" marker-end="url(#arrowRed)"/><rect x="1165.0" y="886.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="1285.0" y="908.0" class="tiny" text-anchor="middle">5b. violation → PolicyViolationError.to_payload()</text><line x1="1710" y1="1010" x2="430" y2="1010" stroke="#ff9aa2" stroke-width="5" marker-end="url(#arrowRed)"/><rect x="950.0" y="976.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="1070.0" y="998.0" class="tiny" text-anchor="middle">6b. TransportRequestRejected or server refusal payload</text><line x1="430" y1="1100" x2="120" y2="1100" stroke="#ff9aa2" stroke-width="5" marker-end="url(#arrowRed)"/><rect x="155.0" y="1066.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="275.0" y="1088.0" class="tiny" text-anchor="middle">7b. caller receives refusal JSON</text></svg>