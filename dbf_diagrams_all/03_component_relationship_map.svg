<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
    <rect width="100%" height="100%" fill="#0b1020"/>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L14,7 L0,14 z" fill="#8fb7ff"/>
      </marker>
      <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L14,7 L0,14 z" fill="#ff9aa2"/>
      </marker>
      <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="#131a2d"/>
        <stop offset="100%" stop-color="#0f1527"/>
      </linearGradient>
      <linearGradient id="accentBlue" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#7aa2ff"/>
        <stop offset="100%" stop-color="#52d3ff"/>
      </linearGradient>
      <linearGradient id="accentRed" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#ff8f8f"/>
        <stop offset="100%" stop-color="#ffb86c"/>
      </linearGradient>
      <style>
        .title { font: 700 38px Arial, sans-serif; fill: #f4f7ff; }
        .subtitle { font: 500 18px Arial, sans-serif; fill: #b9c6e3; }
        .h2 { font: 700 22px Arial, sans-serif; fill: #eef3ff; }
        .text { font: 500 16px Arial, sans-serif; fill: #d8e0f5; }
        .tiny { font: 500 14px Arial, sans-serif; fill: #aebad8; }
        .mono { font: 600 15px 'Courier New', monospace; fill: #dce6ff; }
        .cap { font: 700 13px Arial, sans-serif; fill: #7aa2ff; letter-spacing: 1px; }
      </style>
    </defs>
    <text x="70" y="80" class="title">BoundaryGate Integration Map</text><text x="70" y="112" class="subtitle">Shows how one kernel is shared across client transport, MCP tools, manifest/runtime contract, and refusal handling.</text>
    <g filter="url(#shadow)">
      <rect x="90" y="180" rx="24" ry="24" width="360" height="240" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="110" y="198" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="114" y="238" class="h2">app.py</text>
    <text x="114" y="266" class="cap">client wrapper</text><text x="114" y="298" class="text">ChatPdmTransport</text><text x="114" y="322" class="text">_build_request_config()</text><text x="114" y="346" class="text">_firewall_inspection_payload()</text><text x="114" y="370" class="text">_request_interceptor()</text><text x="114" y="394" class="text">send()</text></g>
    <g filter="url(#shadow)">
      <rect x="520" y="180" rx="24" ry="24" width="420" height="360" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="540" y="198" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="544" y="238" class="h2">policy_firewall.py</text>
    <text x="544" y="266" class="cap">shared deterministic engine</text><text x="544" y="298" class="text">Level2StrictFirewall</text><text x="544" y="322" class="text">PolicyViolationError</text><text x="544" y="346" class="text">build_inspection_surface</text><text x="544" y="370" class="text">_normalize_payload</text><text x="544" y="394" class="text">_scan</text><text x="544" y="418" class="text">evaluate_preflight</text><text x="544" y="442" class="text">check_or_raise</text><text x="544" y="466" class="text">rejection_payload</text></g>
    <g filter="url(#shadow)">
      <rect x="1020" y="180" rx="24" ry="24" width="340" height="240" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="1040" y="198" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="1044" y="238" class="h2">server.py</text>
    <text x="1044" y="266" class="cap">MCP execution surface</text><text x="1044" y="298" class="text">FastMCP</text><text x="1044" y="322" class="text">evaluate_policy_compliance</text><text x="1044" y="346" class="text">enforce_boundary</text><text x="1044" y="370" class="text">strict_mode must stay true</text></g>
    <g filter="url(#shadow)">
      <rect x="1410" y="180" rx="24" ry="24" width="300" height="240" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="1430" y="198" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="1434" y="238" class="h2">mcp.json</text>
    <text x="1434" y="266" class="cap">contract surface</text><text x="1434" y="298" class="text">Manifest describes bounded</text><text x="1434" y="322" class="text">deterministic</text><text x="1434" y="346" class="text">phrase/pattern boundary</text><text x="1434" y="370" class="text">Tool schemas must align</text><text x="1434" y="394" class="text">with runtime</text></g>
    <g filter="url(#shadow)">
      <rect x="180" y="650" rx="24" ry="24" width="360" height="250" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="200" y="668" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="204" y="708" class="h2">Client-side outcomes</text>
    <text x="204" y="736" class="cap">egress boundary</text><text x="204" y="768" class="text">Clean: request proceeds to</text><text x="204" y="792" class="text">Responses API</text><text x="204" y="816" class="text">Violation:</text><text x="204" y="840" class="text">TransportRequestRejected with</text><text x="204" y="864" class="text">refusal payload</text><text x="204" y="888" class="text">Headers still added only on</text><text x="204" y="912" class="text">allowed path</text></g>
    <g filter="url(#shadow)">
      <rect x="760" y="650" rx="24" ry="24" width="420" height="250" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="780" y="668" rx="8" ry="8" width="260" height="8" fill="url(#accentBlue)" opacity="0.95"/>
      <text x="784" y="708" class="h2">Server-side outcomes</text>
    <text x="784" y="736" class="cap">tool boundary</text><text x="784" y="768" class="text">evaluate_policy_compliance: allow or</text><text x="784" y="792" class="text">refused</text><text x="784" y="816" class="text">enforce_boundary: allowed or refused</text><text x="784" y="840" class="text">No hidden fallback logic</text></g>
    <g filter="url(#shadow)">
      <rect x="1300" y="650" rx="24" ry="24" width="360" height="250" fill="url(#card)" stroke="#233252" stroke-width="2"/>
      <rect x="1320" y="668" rx="8" ry="8" width="260" height="8" fill="url(#accentRed)" opacity="0.95"/>
      <text x="1324" y="708" class="h2">Shared refusal contract</text>
    <text x="1324" y="736" class="cap">ERR-403-SINK</text><text x="1324" y="768" class="text">enclave_id</text><text x="1324" y="792" class="text">status=refused</text><text x="1324" y="816" class="text">error_code=403-policy-violation</text><text x="1324" y="840" class="text">mcp_error_code=policy_violation</text><text x="1324" y="864" class="text">blocked_terms</text><text x="1324" y="888" class="text">optional entropy_hit_count</text></g><line x1="450" y1="300" x2="520" y2="300" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="365.0" y="266.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="485.0" y="288.0" class="tiny" text-anchor="middle">client uses</text><line x1="940" y1="300" x2="1020" y2="300" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="860.0" y="266.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="980.0" y="288.0" class="tiny" text-anchor="middle">server uses</text><line x1="1360" y1="300" x2="1410" y2="300" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="1265.0" y="266.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="1385.0" y="288.0" class="tiny" text-anchor="middle">schema alignment</text><line x1="730" y1="540" x2="360" y2="650" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="425.0" y="561.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="545.0" y="583.0" class="tiny" text-anchor="middle">clean/violation branch</text><line x1="880" y1="540" x2="970" y2="650" stroke="#8fb7ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="805.0" y="561.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="925.0" y="583.0" class="tiny" text-anchor="middle">clean/violation branch</text><line x1="940" y1="540" x2="1480" y2="650" stroke="#ff9aa2" stroke-width="5" marker-end="url(#arrowRed)"/><rect x="1090.0" y="561.0" rx="12" ry="12" width="240" height="34" fill="#0d1324" stroke="#243456"/><text x="1210.0" y="583.0" class="tiny" text-anchor="middle">same refusal payload</text></svg>